services:
  postgres:
    image: postgres:16-alpine
    container_name: throttlex-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-throttlex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-throttlex}
      POSTGRES_DB: ${POSTGRES_DB:-throttlex}
    ports:
      - "5432:5432"
    volumes:
      - throttlex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U throttlex -d throttlex"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: throttlex-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - throttlex_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: throttlex-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://throttlex:throttlex@postgres:5432/throttlex?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-production-super-secret-key-throttlex}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      RATE_LIMIT_FAIL_OPEN: "true"
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@throttlex.dev}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin123}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: throttlex-frontend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  throttlex_pgdata:
  throttlex_redisdata:
