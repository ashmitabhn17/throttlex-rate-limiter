services:
  postgres:
    image: postgres:16-alpine
    container_name: throttlex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: throttlex
      POSTGRES_PASSWORD: throttlex
      POSTGRES_DB: throttlex
    ports:
      - "5432:5432"
    volumes:
      - throttlex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U throttlex -d throttlex"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: throttlex-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - throttlex_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  throttlex_pgdata:
  throttlex_redisdata:
